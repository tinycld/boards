name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever it targets — NOT `branches: [main]`.
  #
  # Work here stacks: a PR often targets the unmerged branch below it rather
  # than main. A `branches: [main]` filter silently skips those, so a stacked
  # PR reports "no checks reported" and reads as unverified-but-fine rather
  # than never-run. PR #24 sat three deep with zero runs; text/ hit the same
  # wall and worked around it by hardcoding one branch into the `push` trigger,
  # which needs editing for every new stack.
  #
  # A stacked PR is tested as a merge into ITS OWN base, which is what you
  # want — each PR verifies its own increment, and the branch below it is
  # verified by its own run. The `push: [main]` trigger above still covers
  # post-merge trunk.
  pull_request:

env:
  PACKAGE: cards
  TEST_USER_LOGIN: user@tinycld.org
  TEST_USER_PW: TestUser1234!
  ADMIN_USER_LOGIN: admin@tinycld.org
  ADMIN_USER_PW: AdminPass1234!

jobs:
  check:
    name: Typecheck, Unit & Access Rules
    runs-on: ubuntu-latest
    steps:
      # This PR's code, checked out into its member slot. The workspace root is
      # not a committed repo — bootstrap assembles it from scratch around this
      # checkout. `--assemble-only` clones the `tinycld` member (app shell + core
      # + package-scripts), skipping PACKAGE's slot since it's already present,
      # so CI tests this PR's code.
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - name: Resolve sibling refs
        id: sibling
        run: |
          # Coordinated cross-repo work (e.g. the single-org migration) lives on
          # the SAME branch name in every repo. Assembling siblings from their
          # default branch then typechecks this PR against a core that predates
          # it — the branch's own APIs are simply absent, so every consumer
          # fails with errors that look like the PR's fault.
          #
          # For each sibling, prefer a branch matching this PR's HEAD and fall
          # back to its default branch when there is none (the ordinary
          # single-repo PR, where every sibling should be at its release state).
          #
          # Only `tinycld` is listed: cards declares no sibling dependencies.
          # M6's "attach from Drive" is presence-gated, so drive joins this loop
          # (and the --with below) when that lands — not before, since cloning it
          # now would slow every run for a package cards never imports.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in tinycld; do
            if [ -n "$BRANCH" ] && \
               git ls-remote --exit-code --heads "https://github.com/tinycld/$repo" "$BRANCH" >/dev/null 2>&1; then
              echo "${repo}_ref=@$BRANCH" >> "$GITHUB_OUTPUT"
              echo "$repo -> $BRANCH"
            else
              echo "${repo}_ref=" >> "$GITHUB_OUTPUT"
              echo "$repo -> (default branch)"
            fi
          done
      # Pin a Node that satisfies bootstrap's engines.node (>=24) so the assemble
      # step doesn't depend on whatever ubuntu-latest ships.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: |
          TINYCLD_REPO_BASE=https://github.com/tinycld \
            npx @tinycld/bootstrap@latest --assemble-only \
            --with "tinycld${{ steps.sibling.outputs.tinycld_ref }}"
      # Switch to the version the assembled workspace pins (ws/.node-version is
      # written by the assemble step above).
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      # cache-dependency-path matters more than it looks: the install below runs a
      # postinstall that regenerates the PB schema, which shells out to Go and
      # pulls core's module graph. That download — not package fetching — is the
      # bulk of the install step's runtime.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
          # cards' own key is go.mod, not go.sum: cards deliberately commits no
          # go.sum (see the comment in server/go.mod — every dep resolves
          # through go.work replaces to local dirs, so there are no module
          # hashes to record). The hand-maintained require block still changes
          # whenever a dependency does, so it is the right key for this repo.
          #
          # The tinycld go.sum files join the key the way core's own CI keys on
          # them: the modules the postinstall's schema generation (and the e2e
          # server build) actually downloads are CORE's graph, resolved through
          # go.work — so a key blind to those files caches almost none of what
          # the job spends its time fetching. The assemble step above has
          # already cloned ws/tinycld by the time this hashes.
          cache-dependency-path: |
            ws/cards/server/go.mod
            ws/tinycld/server/go.sum
            ws/tinycld/core/server/go.sum
      # corepack enables the pnpm version pinned in the workspace root's
      # "packageManager" field. pnpm discovers members from pnpm-workspace.yaml;
      # node-linker=hoisted (set there) gives a flat node_modules so member
      # peerDeps resolve.
      # Cache pnpm's content-addressable store. setup-node's built-in `cache: pnpm`
      # can't be used: it keys on a lockfile hash, and the workspace root here is
      # bootstrap-GENERATED, so no lockfile exists until the install produces one.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ws/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('ws/package.json', 'ws/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile --store-dir=.pnpm-store
      # Also the real test of the PB migrations: install runs the generator,
      # which boots a throwaway PocketBase and replays every migration to
      # regenerate pbSchema.ts. A migration that can't apply fails here.
      - name: Typecheck + unit
        working-directory: ws/${{ env.PACKAGE }}
        run: pnpm exec tinycld-pkg check
      # cards/server holds almost no product logic — it is the RLS suite that
      # proves the migration's access rules against PocketBase's REAL rule
      # engine, plus the board-face counters and the presence-room authorize.
      # Those rules are the whole authorization for every caller that does not
      # pass through a Go hook, and nothing else verifies them.
      # `tinycld-pkg check` has no Go runner, so they run here.
      #
      # go mod download is not optional: in workspace mode the transitive
      # /go.mod hashes live in go.work.sum, not go.sum, and `go test` fails with
      # "missing go.sum entry for go.mod file" without it. The go.work itself
      # was written by the generator during `pnpm install` above.
      - name: Go build
        working-directory: ws/${{ env.PACKAGE }}/server
        run: |
          go mod download
          go build ./...
      - name: Go test (access rules)
        working-directory: ws/${{ env.PACKAGE }}/server
        run: go test ./...

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      # Playwright exits 0 when testDir contains no specs, so without this gate
      # the job would assemble a workspace, build a bundle and boot a server for
      # several minutes, then report green having run nothing — a check that
      # cannot fail, which reads as coverage on the PR page. cards has no
      # tests/e2e yet (it arrives with M7); skip honestly until it does.
      - name: Check for e2e specs
        id: specs
        run: |
          # `find`, not a glob: specs may sit in subdirectories, and a glob that
          # only matches the top level would silently skip them — reintroducing
          # the false green from the other direction.
          if [ -n "$(find "ws/${{ env.PACKAGE }}/tests/e2e" -name '*.spec.ts' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No *.spec.ts under ${{ env.PACKAGE }}/tests/e2e — skipping E2E."
          fi
      - name: Resolve sibling refs
        if: steps.specs.outputs.found == 'true'
        id: sibling
        run: |
          # See the check job for why this exists.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in tinycld; do
            if [ -n "$BRANCH" ] && \
               git ls-remote --exit-code --heads "https://github.com/tinycld/$repo" "$BRANCH" >/dev/null 2>&1; then
              echo "${repo}_ref=@$BRANCH" >> "$GITHUB_OUTPUT"
              echo "$repo -> $BRANCH"
            else
              echo "${repo}_ref=" >> "$GITHUB_OUTPUT"
              echo "$repo -> (default branch)"
            fi
          done
      - uses: actions/setup-node@v5
        if: steps.specs.outputs.found == 'true'
        with:
          node-version: '24'
      - name: Assemble workspace (app + core)
        if: steps.specs.outputs.found == 'true'
        working-directory: ws
        run: |
          TINYCLD_REPO_BASE=https://github.com/tinycld \
            npx @tinycld/bootstrap@latest --assemble-only \
            --with "tinycld${{ steps.sibling.outputs.tinycld_ref }}"
      - uses: actions/setup-node@v5
        if: steps.specs.outputs.found == 'true'
        with:
          node-version-file: ws/.node-version
      - uses: actions/setup-go@v6
        if: steps.specs.outputs.found == 'true'
        with:
          go-version-file: ws/.go-version
          # Same key as the check job — see the note there.
          cache-dependency-path: |
            ws/cards/server/go.mod
            ws/tinycld/server/go.sum
            ws/tinycld/core/server/go.sum
      - name: Cache pnpm store
        if: steps.specs.outputs.found == 'true'
        uses: actions/cache@v6
        with:
          path: ws/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('ws/package.json', 'ws/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install (workspace root)
        if: steps.specs.outputs.found == 'true'
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile --store-dir=.pnpm-store
      # Shared e2e prep: installs the Playwright browser and pre-builds the
      # static web bundle (expo export + sourcemaps). e2e serves that bundle
      # statically — there's no Metro at runtime. The E2E step reuses the built
      # bundle via TINYCLD_E2E_SKIP_EXPORT.
      - name: Configure test env
        if: steps.specs.outputs.found == 'true'
        uses: ./ws/tinycld/.github/actions/configure-test-env
      - name: E2E
        if: steps.specs.outputs.found == 'true'
        working-directory: ws/${{ env.PACKAGE }}
        env:
          # The bundle was built by the action above; reuse it (the webServer
          # still seeds + promotes + serves, just doesn't export a second time).
          TINYCLD_E2E_SKIP_EXPORT: '1'
        run: pnpm exec tinycld-pkg test:e2e
      # Capture Playwright's per-failure artifacts (trace, screenshot, video,
      # error-context.md) so a CI failure can be diagnosed without a re-run.
      # `if: failure()` skips the upload on green runs to save bandwidth.
      - name: Upload Playwright artifacts
        if: failure() && steps.specs.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            ws/${{ env.PACKAGE }}/test-results/
            ws/${{ env.PACKAGE }}/playwright-report/
          retention-days: 14
